<div class="page">
  <div class="profil-grid">
    <div class="card custom-border p-3 text-center profil-photo-card">
      <img src="assets/product.png" class="profil-avatar" alt="Photo de profil" />
      <h2>Nom Prenom</h2>
      <small class="text-muted">Adresse, Ville, 12345</small>
    </div>

    <div class="card custom-border p-3">
      <form>
        <label class="caption" for="ancienmdp">Ancien mot de passe</label>
        <app-champ-mot-de-passe inputId="ancienmdp" [(valeur)]="ancienMotDePasse"
                                placeholder="Ancien mot de passe"
                                [erreur]="erreurAncien().length > 0"
                                autocomplete="current-password"></app-champ-mot-de-passe>
        @for (msg of erreurAncien(); track $index) {
          <p class="field-error">{{ msg }}</p>
        }

        <label class="caption" for="nouveaumdp" style="margin-top: var(--sp-md)">Nouveau mot de passe</label>
        <app-champ-mot-de-passe inputId="nouveaumdp" [(valeur)]="changerMotDePasseDto.motDePasse"
                                placeholder="Nouveau mot de passe"
                                [erreur]="erreurNouveau().length > 0"
                                autocomplete="new-password"></app-champ-mot-de-passe>
        @for (msg of erreurNouveau(); track $index) {
          <p class="field-error">{{ msg }}</p>
        }

        <label class="caption" for="confirmmdp" style="margin-top: var(--sp-md)">Confirmer le mot de passe</label>
        <app-champ-mot-de-passe inputId="confirmmdp" [(valeur)]="changerMotDePasseDto.confirmMotDePasse"
                                placeholder="Confirmer mot de passe"
                                [erreur]="erreurConfirmation().length > 0"
                                autocomplete="new-password"></app-champ-mot-de-passe>
        @for (msg of erreurConfirmation(); track $index) {
          <p class="field-error">{{ msg }}</p>
        }
      </form>

      <div class="form-actions" style="margin-top: var(--sp-lg)">
        <button class="btn btn-secondary" (click)="cancel()">Annuler</button>
        <button class="btn btn-primary" (click)="changerMotDePasseUtilisateur()">Enregistrer</button>
      </div>
    </div>
  </div>
</div>
