<div class="pwd-field">
  <!-- Pattern du projet (voir nouvel-utilisateur) : [value] + (input), sans FormsModule -->
  <input [id]="inputId()" [type]="afficher() ? 'text' : 'password'" class="form-control" [class.input-error]="erreur()"
         [placeholder]="placeholder()" [autocomplete]="autocomplete()"
         [value]="valeur()" (input)="valeur.set($any($event.target).value)">

  <button type="button" class="pwd-toggle" (click)="basculerAffichage()"
          [attr.aria-label]="afficher() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
          [attr.aria-pressed]="afficher()"
          [title]="afficher() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'">
    <!-- Œil ouvert (mot de passe visible) -->
    @if (afficher()) {
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    } @else {
      <!-- Œil barre (mot de passe masque) -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
        <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </svg>
    }
  </button>
</div>
